#yato-bubble-designs button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;font:inherit;color:inherit;background:none;cursor:var(--cursor-interaction,pointer);min-height:32px;border-radius:8px;padding:6px 10px;font-size:12px}
#yato-bubble-designs button:hover{background:color-mix(in srgb,var(--yp-accent) 16%,transparent)}
#yato-bubble-designs button:focus-visible,#yato-bubble-designs input:focus-visible{outline:2px solid var(--yp-accent);outline-offset:3px}
#yato-bubble-designs .scenario button{color:var(--yp-muted);background:var(--yp-surface);border:1px solid var(--yp-line)}
#yato-bubble-designs .scenario button[aria-pressed=true]{background:var(--yp-accent);color:var(--yp-onaccent);border-color:var(--yp-accent)}
#yato-bubble-designs .scene-layout{display:flex;align-items:flex-start;justify-content:center;gap:12px;max-width:650px;margin:auto}
#yato-bubble-designs .yato-panel{position:relative;flex:0 1 380px;min-width:0;background:var(--yp-surface);border:1px solid var(--yp-line);border-radius:22px;padding:18px;box-shadow:0 10px 30px #10091714;overflow-wrap:anywhere}
#yato-bubble-designs .yato-panel:after{content:&#x27;&#x27;;position:absolute;top:57px;right:-6px;width:10px;height:10px;background:var(--yp-surface);border-top:1px solid var(--yp-line);border-right:1px solid var(--yp-line);transform:rotate(45deg)}
#yato-bubble-designs header{display:flex;gap:9px;align-items:center;margin-bottom:18px;font-size:12px}
#yato-bubble-designs .identity{display:flex;gap:7px;align-items:center;font-weight:600;font-size:14px;letter-spacing:.3px}
#yato-bubble-designs .presence{width:5px;height:5px;border-radius:50%;background:var(--yp-accent)}
#yato-bubble-designs .muted{color:var(--yp-muted);font-size:11px}
#yato-bubble-designs .fold{margin-left:auto;padding:3px;min-width:26px}
#yato-bubble-designs .topic{display:block;color:var(--yp-muted);font-size:11px;letter-spacing:1.1px;margin-bottom:10px}
#yato-bubble-designs .headline{font-family:inherit;font-size:20px;line-height:1.4;font-weight:500;margin:0;overflow-wrap:anywhere}
#yato-bubble-designs .detail{margin-top:13px;font-size:14px;line-height:1.7;color:var(--yp-ink)}
#yato-bubble-designs .detail p{margin:0 0 10px}
#yato-bubble-designs .byline{font-size:11px;line-height:1.5;color:var(--yp-muted);margin:14px 0 6px}
#yato-bubble-designs .expand{color:light-dark(#6f459b,#d5b5fa);padding-left:0}
#yato-bubble-designs .composer{margin-top:17px;border-top:1px solid var(--yp-line);padding-top:15px}
#yato-bubble-designs .input-row{display:flex;gap:7px;align-items:center}
#yato-bubble-designs input{min-width:0;width:100%;font:inherit;font-size:13px;border:1px solid var(--yp-line);border-radius:13px;padding:12px;background:var(--yp-input);color:var(--yp-ink)}
#yato-bubble-designs input::placeholder{color:var(--yp-muted)}
#yato-bubble-designs .input-row button{background:var(--yp-accent);color:var(--yp-onaccent);flex:0 0 38px;min-height:40px;padding:0;border-radius:12px}
#yato-bubble-designs .chat-toggle{border-top:1px solid var(--yp-line);width:100%;margin-top:12px;border-radius:0;padding-top:13px;justify-content:flex-start;color:light-dark(#6f459b,#d5b5fa)}
#yato-bubble-designs .yato-character{width:150px;height:auto;flex:0 0 150px;align-self:flex-start;margin-top:35px;object-fit:contain}
#yato-bubble-designs .answer{font-size:14px;line-height:1.6;border-top:1px solid var(--yp-line);margin-top:14px;padding-top:14px;white-space:pre-wrap}
#yato-bubble-designs .answer strong{font-size:25px;font-weight:500;display:block;margin-bottom:5px}
#yato-bubble-designs .sr-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#yato-bubble-designs [hidden]{display:none!important}
#yato-bubble-designs [data-design=compact] .yato-panel{flex-basis:300px;border-radius:17px;padding:16px}
#yato-bubble-designs [data-design=compact] .headline{font-size:15px;line-height:1.6}
#yato-bubble-designs [data-design=compact] header{margin-bottom:12px}
#yato-bubble-designs [data-design=reading] .yato-panel{border-top:3px solid var(--yp-accent)}
#yato-bubble-designs [data-design=conversation] .yato-panel{flex-basis:390px;border-radius:22px;padding:0}
#yato-bubble-designs [data-design=conversation] header{padding:16px 18px;margin:0;border-bottom:1px solid var(--yp-line)}
#yato-bubble-designs [data-design=conversation] .panel-content{padding:18px 20px}
#yato-bubble-designs [data-design=conversation] .headline{font-size:17px}
#yato-bubble-designs .intro-line{font-size:14px;margin:0 0 18px;color:var(--yp-muted)}
#yato-bubble-designs [data-design=conversation] .composer{margin:0;padding:15px 16px}
#yato-bubble-designs .conversation-history{padding:0 18px 18px;line-height:1.6;font-size:14px}
#yato-bubble-designs .user-line{background:light-dark(#e8daf7,#3d2f4b);padding:10px 13px;border-radius:14px 14px 4px 14px;margin:0 0 15px 30px}
#yato-bubble-designs .reply-line{white-space:pre-wrap}
#yato-bubble-designs .yato-panel.collapsed .panel-content,#yato-bubble-designs .yato-panel.collapsed .composer,#yato-bubble-designs .yato-panel.collapsed .answer,#yato-bubble-designs .yato-panel.collapsed .chat-toggle,#yato-bubble-designs .yato-panel.collapsed .conversation-history{display:none}
#yato-bubble-designs .yato-panel.collapsed header{margin:0;border:0}
@media(max-width:520px){#yato-bubble-designs .yato-stage{min-height:840px;padding:18px 8px 30px}#yato-bubble-designs .scene-layout{display:block}#yato-bubble-designs .yato-panel{width:100%;max-width:390px;margin:auto}#yato-bubble-designs .yato-panel:after{display:none}#yato-bubble-designs .yato-character{display:block;width:86px;margin:15px 0 0 auto}#yato-bubble-designs .scenario{gap:4px}#yato-bubble-designs .headline{font-size:18px}}
&lt;/style&gt;

function calculate(text){
 const s=text.toLowerCase().replace(/,/g,&#x27;.&#x27;);
 const percent=s.match(/(-?\d+(?:\.\d+)?)\s*(?:%|por cento)\s*(?:de|do|da)\s*(-?\d+(?:\.\d+)?)/);
 if(percent)return `${Number(percent[1])*Number(percent[2])/100}\n${percent[1]}% de ${percent[2]}.`;
 const binary=s.match(/(-?\d+(?:\.\d+)?)\s*(\+|-|×|x|\*|\/|÷|vezes|mais|menos|dividido por)\s*(-?\d+(?:\.\d+)?)/);
 if(!binary)return null;
 const a=Number(binary[1]),b=Number(binary[3]),op=binary[2];let result;
 if([&#x27;+&#x27;,&#x27;mais&#x27;].includes(op))result=a+b;else if([&#x27;-&#x27;,&#x27;menos&#x27;].includes(op))result=a-b;else if([&#x27;×&#x27;,&#x27;x&#x27;,&#x27;*&#x27;,&#x27;vezes&#x27;].includes(op))result=a*b;else{if(b===0)return &#x27;Não dá para dividir por zero.&#x27;;result=a/b;}
 return `${new Intl.NumberFormat(&#x27;pt-BR&#x27;,{maximumFractionDigits:8}).format(result)}\n${a} ${op} ${b}`;
}
